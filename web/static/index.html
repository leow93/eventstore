<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eventstore Console</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" title="Home">
        <span class="logo">◆</span>
        <span>Eventstore Console</span>
      </div>
      <div class="stats" id="stats">
        <span class="stat"><b id="stat-streams">–</b> streams</span>
        <span class="stat"><b id="stat-categories">–</b> categories</span>
        <span class="stat"><b id="stat-events">–</b> events</span>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        <button class="navbtn" data-view="streams">Streams</button>
        <button class="navbtn" data-view="categories">Categories</button>
      </nav>
      <main id="main" class="main">
        <div class="empty">Loading…</div>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
